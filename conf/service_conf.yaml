# When bucket names one physical bucket shared by every knowledge base, set
# prefix_path as well. It gives each logical bucket its own key prefix, so an
# object lands at {prefix_path}/{logical_bucket}/{filename}, and that prefix is
# what lets remove_bucket scope a dataset teardown to a single logical bucket.
# Without it the keys of one logical bucket cannot be told apart from the rest,
# so a shared bucket cannot be torn down at all.
# s3:
#   access_key: 'access_key'
#   secret_key: 'secret_key'
#   region: 'region'
#   endpoint_url: 'https://endpoint_url'          # https only
#   ca_certs: 'docker/certs/ragflow/ca.pem'       # required, CA that verifies the endpoint
#   client_cert: 'docker/certs/ragflow/cert.pem'  # required, presented to the endpoint
#   client_key: 'docker/certs/ragflow/key.pem'    # required
#   prefix_path: 'prefix_path'
#   connect_timeout: 10        # seconds to establish a connection
#   read_timeout: 60           # seconds to read a response
#   retries_max_attempts: 5    # applied with botocore retry mode 'standard'
#   pool_size: 32              # pooled connections; botocore's default of 10 serialises concurrent I/O
