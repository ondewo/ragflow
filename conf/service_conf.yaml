general:
  heartbeat_interval: 3s
ragflow:
  host: 0.0.0.0
  http_port: 9380
  # Proxies whose X-Forwarded-For / X-Real-IP headers the Go API server trusts
  # when resolving the client address (agent webhook ip_whitelist, login audit).
  # Defaults to loopback, i.e. the nginx bundled in this image. An explicit list
  # replaces that default, so keep the loopback entries when adding the address
  # or CIDR of a further proxy in front of nginx; an empty list trusts none.
  # trusted_proxies: ['127.0.0.0/8', '::1/128']

# DeepDoc in-process (Go) ONNX inference settings.
deepdoc:
  # Max concurrent DeepDoc ONNX inference Runs in this process; each Run uses
  # exactly one CPU core (intraOpThreads is pinned to 1 in the native package).
  # Override with the env var RAGFLOW_DEEPDOC_INFERENCE_CONCURRENCY, or the CLI
  # flag --deepdoc-inference-concurrency (highest precedence). Default 4.
  inference_concurrency: 4

# Optional standalone MCP listener for the Go API server. Uncomment to enable.
# RAGFLOW_MCP_* environment variables override these settings.
# mcp:
#   enabled: true
#   host: 127.0.0.1
#   port: 9382
#   launch_mode: host # Each client supplies its own RAGFlow API key.
#   # self-host gives every client the same identity; use only on trusted networks.
#   # Set host_api_key below or, preferably, RAGFLOW_MCP_HOST_API_KEY.
#   host_api_key: ''
#   transport_sse_enabled: true # /sse and /messages/
#   transport_streamable_enabled: true # /mcp
#   json_response: true # false streams Streamable HTTP responses.

admin:
  host: 0.0.0.0
  http_port: 9381
vastbase:
  host: 'host.docker.internal'
  port: 5432
  user: 'vastbase'
  password: 'Vastdata@123'
  db_name: 'vastbase'
  dbcompatibility: 'B'
mysql:
  name: 'rag_flow'
  user: 'root'
  password: 'infini_rag_flow'
  host: 'localhost'
  port: 3306
  max_connections: 900
  stale_timeout: 300
  max_allowed_packet: 1073741824
minio:
  user: 'rag_flow'
  password: 'infini_rag_flow'
  host: 'localhost:9000'
  bucket: ''
  prefix_path: ''
es:
  hosts: 'http://localhost:1200'
  username: 'elastic'
  password: 'infini_rag_flow'
os:
  hosts: 'https://localhost:1201'
  username: 'admin'
  password: 'infini_rag_flow_OS_01'
  # Required: TLS with a verified server name and a client certificate (docker/generate_dev_certs.sh).
  ca_certs: 'docker/certs/ragflow/ca.pem'
  client_cert: 'docker/certs/ragflow/cert.pem'
  client_key: 'docker/certs/ragflow/key.pem'
  # Optional hybrid (BM25 + KNN) search tuning. The connector self-provisions the
  # normalization search pipeline on start-up (requires OpenSearch >= 2.10).
  # hybrid_search_pipeline: 'ragflow_hybrid_pipeline'
  # hybrid_search_weights: [0.5, 0.5]   # [text/BM25 leg, vector/KNN leg]
  # Optional urllib3 connection-pool size for the OpenSearch client. The
  # client library default of 10 serialises concurrent upload, parse and
  # retrieval traffic over ten sockets.
  # pool_size: 32
  # Optional replicas of the ragflow_* indices, overridden by the environment variable OS_NUMBER_OF_REPLICAS.
  # The default '0-1' lets OpenSearch keep the replicas equal to the data nodes, so one node has none and a cluster survives the loss of a node.
  # A number such as 2 is a fixed replica count, a range such as '0-2' or '0-all' another auto-expand range.
  # number_of_replicas: '0-1'
infinity:
  uri: 'localhost:23817'
  postgres_port: 5432
  db_name: 'default_db'
oceanbase:
  scheme: 'oceanbase' # set 'mysql' to create connection using mysql config
  config:
    db_name: 'test'
    user: 'root@ragflow'
    password: 'infini_rag_flow'
    host: 'localhost'
    port: 2881
redis:
  db: 1
  username: ''
  password: 'infini_rag_flow'
  host: 'localhost:6379'
  # Required: TLS with a verified server name and a client certificate (docker/generate_dev_certs.sh).
  ca_certs: 'docker/certs/ragflow/ca.pem'
  client_cert: 'docker/certs/ragflow/cert.pem'
  client_key: 'docker/certs/ragflow/key.pem'
kvrocks:
  db: 1
  username: ''
  password: 'infini_rag_flow'
  host: 'localhost:6379'
nats:
  host: "localhost"
  port: 4222
clickhouse:
  host: 'localhost'
  port: 9900
  user: ragflow
  password: infini_rag_flow
  database: ragflow
otel:
  host: "localhost"
  port: 4318
  secure: false
  sample_ratio: 1.0
  stdout: false
  enable: false
ingestor:
  mq_type: 'nats'
  max_concurrent_workers: 2
  compiler_pool_size: 0
file_syncer:
  max_concurrent_syncs: 5
user_default_llm:
  default_models:
    embedding_model:
      name: 'bge-m3'
      factory: 'xxxx'
      api_key: 'xxx'
      base_url: 'http://localhost:6380'
gcs:
  bucket: '${GCS_BUCKET:-ragflow}'
  prefix_path: '${GCS_PREFIX_PATH:-}'
  endpoint_url: '${GCS_ENDPOINT:-}'
